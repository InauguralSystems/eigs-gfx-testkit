name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build EigenScript from source
        run: |
          git clone --depth 1 https://github.com/InauguralSystems/EigenScript.git "$RUNNER_TEMP/eigs"
          make -C "$RUNNER_TEMP/eigs" -s
          echo "EIGENSCRIPT=$RUNNER_TEMP/eigs/src/eigenscript" >> "$GITHUB_ENV"

      # Heuristic: planted-fault / mktemp trees must mention eigs.json
      # (EigenScript #1106; bought eddy#18 + dynamics#39). Vendored from hq.
      - name: Check TMP plants mention eigs.json
        run: bash tools/check_tmp_eigs_json.sh

      - name: Unit tests
        run: |
          "$EIGENSCRIPT" tests/test_gfx_testkit.eigs

      - name: Consumer-shaped smoke test
        run: bash tests/test_smoke.sh

      - name: Planted faults (each stub drops its call; tests must go red)
        run: bash tests/plant_drop.sh
